<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heia</title>
  <style>
    /* Heia A v2-tonene: krembakgrunn, mint-flate, dyp grønn tekst. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      background: #FBF7EC;
      color: #08392E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: linear-gradient(140deg, #DFFBEA 0%, #F4F9E6 70%, #FAF4DC 100%);
      border: 1px solid #CDEEDA;
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .emoji { font-size: 44px; }
    h1 { font-size: 24px; margin: 16px 0 10px; letter-spacing: -0.3px; }
    p { font-size: 16px; line-height: 1.5; color: #3C5A50; margin-bottom: 8px; }
    .hint { font-size: 13px; color: #7A8F87; margin-top: 14px; }
    a.btn {
      display: inline-block;
      margin-top: 22px;
      background: #08392E;
      color: #DFFBEA;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji" id="emoji">💚</div>
    <h1 id="title">Tusen takk for støtten!</h1>
    <p id="body">Betalingen behandles hos Stripe. Statusen i Heia-appen
      oppdaterer seg av seg selv om et lite øyeblikk.</p>
    <!-- heia://-skjemaet finnes i appen fra bygg 1.0 (1). Ruten /lagkassa
         forstås fra 1.0 (2) — eldre bygg åpner bare appen (skjema-match
         holder). Knappen vises kun på iOS — en desktop-nettleser har ingen
         app å åpne. -->
    <a class="btn" id="openApp" href="heia://lagkassa" style="display:none">Åpne Heia-appen</a>
    <p class="hint">Du kan trygt lukke denne siden.</p>
  </div>
  <script>
    // Samme side for alle flows — teksten byttes klient-side.
    var flows = {
      success: {emoji: '💚', title: 'Tusen takk for støtten!',
        body: 'Betalingen behandles hos Stripe. Statusen i Heia-appen oppdaterer seg av seg selv om et lite øyeblikk.'},
      cancel: {emoji: '🙂', title: 'Ingen betaling ble gjennomført',
        body: 'Ombestemmer du deg, står «Støtt laget»-knappen klar i appen når som helst.'},
      portal: {emoji: '💚', title: 'Alt lagret!',
        body: 'Endringer i støtten din oppdaterer seg i Heia-appen om et lite øyeblikk.'},
      onboarding: {emoji: '⚽️', title: 'Det var alt!',
        body: 'Gå tilbake til Heia-appen — statusen der oppdaterer seg av seg selv.'},
      refresh: {emoji: '⏳', title: 'Lenken er utløpt',
        body: 'Lenker fra Stripe varer bare en kort stund. Gå tilbake til Heia-appen og hent en fersk lenke.'}
    };
    var flow = new URLSearchParams(location.search).get('flow');
    var f = flows[flow] || flows.success;
    document.getElementById('emoji').textContent = f.emoji;
    document.getElementById('title').textContent = f.title;
    document.getElementById('body').textContent = f.body;
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      document.getElementById('openApp').style.display = 'inline-block';
    }
  </script>
</body>
</html>
